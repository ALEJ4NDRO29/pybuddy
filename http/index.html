<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>i-Buddy Control Panel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #0f0f1a;
        color: #e0e0e0;
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        text-align: center;
        font-size: 1.6rem;
        margin-bottom: 4px;
      }
      .subtitle {
        text-align: center;
        color: #666;
        font-size: 0.8rem;
        margin-bottom: 20px;
      }
      #status {
        text-align: center;
        padding: 8px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 0.85rem;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #1a1a2e;
        color: #888;
      }
      #status.ok {
        background: #1a3a2e;
        color: #4ade80;
      }
      #status.err {
        background: #3a1a1e;
        color: #f87171;
      }
      #status.loading {
        background: #1a2a3e;
        color: #60a5fa;
      }
      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid #666;
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #status.loading .spinner {
        display: inline-block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      section {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 0.75rem;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .grid button {
        flex: 1 0 calc(25% - 8px);
        min-width: 70px;
      }
      button {
        padding: 10px 8px;
        border: none;
        border-radius: 8px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.12s;
        background: #2a2a3e;
        color: #ccc;
        font-family: inherit;
      }
      button:hover {
        filter: brightness(1.3);
        transform: translateY(-1px);
      }
      button:active {
        transform: scale(0.96);
      }
      @media (max-width: 400px) {
        .grid button {
          flex: 1 0 calc(50% - 8px);
        }
      }
      .c-red {
        background: #dc2626;
      }
      .c-green {
        background: #16a34a;
      }
      .c-blue {
        background: #2563eb;
      }
      .c-yellow {
        background: #ca8a04;
        color: #111;
      }
      .c-purple {
        background: #7c3aed;
      }
      .c-cyan {
        background: #0891b2;
      }
      .c-white {
        background: #e2e8f0;
        color: #111;
      }
      .act {
        background: #1e293b;
      }
      .dng {
        background: #991b1b;
      }
      .row-2 {
        display: flex;
        gap: 8px;
      }
      .row-2 button {
        flex: 1;
      }
      .input-row {
        display: flex;
        gap: 8px;
      }
      .input-row input {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 8px;
        background: #2a2a3e;
        color: #e0e0e0;
        font-family: inherit;
        font-size: 0.8rem;
        text-align: center;
        outline: none;
      }
      .input-row input:focus {
        outline: 1px solid #60a5fa;
      }
      .input-row button {
        flex: 0 0 auto;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <h1>&#x1F47C; i-Buddy</h1>
    <p class="subtitle">USB desk pet control panel</p>

    <div id="status"><span>Ready</span></div>

    <section>
      <h2>Colors</h2>
      <div class="grid">
        <button class="c-red" data-color="red">Red</button>
        <button class="c-green" data-color="green">Green</button>
        <button class="c-blue" data-color="blue">Blue</button>
        <button class="c-yellow" data-color="yellow">Yellow</button>
        <button class="c-purple" data-color="purple">Purple</button>
        <button class="c-cyan" data-color="cyan">Cyan</button>
        <button class="c-white" data-color="white">White</button>
      </div>
    </section>

    <section>
      <h2>Actions</h2>
      <div class="grid">
        <button class="act" data-action="flap">Flap Wings</button>
        <button class="act" data-action="wiggle">Wiggle</button>
        <button class="act" data-action="heartbeat">Heartbeat</button>
        <button class="act" data-action="party">Party</button>
        <button class="act" data-action="demo">Demo</button>
        <button class="dng" data-action="reset">Reset</button>
      </div>
    </section>

    <section>
      <h2>Heart</h2>
      <div class="row-2" style="margin-bottom:8px">
        <button class="act" data-action="heart-on">&#x2764; On</button>
        <button class="act" data-action="heart-off">&#x2764; Off</button>
      </div>
      <div class="input-row">
        <input id="hb-times" type="number" min="1" value="3" placeholder="reps" />
        <input id="hb-speed" type="number" min="0.05" step="0.05" value="0.3" placeholder="timing" />
        <button class="act" id="btn-heartbeat">&#x2764; Heartbeat</button>
      </div>
    </section>

    <section>
      <h2>Wings</h2>
      <div class="row-2">
        <button class="act" data-action="wing-up">&#x2191; Up</button>
        <button class="act" data-action="wing-center">&#x2014; Center</button>
        <button class="act" data-action="wing-down">&#x2193; Down</button>
      </div>
    </section>

    <section>
      <h2>Swivel</h2>
      <div class="row-2">
        <button class="act" data-action="swivel-left">&#x2190; Left</button>
        <button class="act" data-action="swivel-center">&#x2014; Center</button>
        <button class="act" data-action="swivel-right">&#x2192; Right</button>
      </div>
    </section>

    <script>
      const statusEl = document.getElementById("status");

      function setStatus(msg, type) {
        statusEl.className = type || "";
        const textSpan =
          statusEl.querySelector("span") || document.createElement("span");
        textSpan.textContent = msg;
        statusEl.innerHTML = "";
        if (type === "loading") {
          const spinner = document.createElement("div");
          spinner.className = "spinner";
          statusEl.appendChild(spinner);
        }
        statusEl.appendChild(textSpan);
      }

      async function callApi(path) {
        setStatus("sending " + path.split("/").pop() + "...", "loading");
        try {
          const request = await fetch(path);
          const response = await request.json();
          if (response.error) {
            setStatus(response.error, "err");
            return;
          }
          setStatus(response.status || "ok", "ok");
        } catch (e) {
          setStatus("connection error: " + e.message, "err");
        }
      }

      document.querySelectorAll("[data-color]").forEach((btn) => {
        btn.addEventListener("click", () =>
          callApi("/api/color/" + btn.dataset.color),
        );
      });
      document.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const action = btn.dataset.action;
          if (action.includes("-")) {
            const [base, param] = action.split("-");
            callApi("/api/" + base + "/" + param);
          } else {
            callApi("/api/" + action);
          }
        });
      });

      document.getElementById("btn-heartbeat").addEventListener("click", () => {
        const times = document.getElementById("hb-times").value || 3;
        const speed = document.getElementById("hb-speed").value || 0.3;
        callApi(`/api/heartbeat/${times}/${speed}`);
      });
    </script>
  </body>
</html>
